name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: build:mac:arm64
            target: macOS-Apple-Silicon
            artifact: build/darwin-arm64/*.dmg
          - os: macos-latest
            script: build:mac:intel
            target: macOS-Intel
            artifact: build/darwin-amd64/*.dmg
          - os: windows-latest
            script: build:windows
            target: Windows-x64
            artifact: build/windows-amd64/*-setup-*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npm ci
      - run: npm test
      - run: go test ./...
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ImgCompress-${{ matrix.target }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
